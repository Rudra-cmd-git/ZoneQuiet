name: Publish GitHub Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore restored from base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "debug.keystore generated via keytool"
          fi

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew || true

      - name: Build APK with Gradle
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug
          else
            ./gradlew assembleDebug
          fi

      - name: Prepare Release APK Asset
        run: |
          mkdir -p release-assets
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/ZoneQuiet-${TAG_NAME}.apk"
          echo "Release asset prepared: release-assets/ZoneQuiet-${TAG_NAME}.apk"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "ZoneQuiet ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: release-assets/ZoneQuiet-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### ZoneQuiet Android Application
            
            **ZoneQuiet** automatically toggles Do Not Disturb (DND) when you enter a custom geofence perimeter and restores your normal alert mode when you leave.
            
            #### Highlights:
            - **Interactive OpenStreetMap** with custom radius visualizer (50m - 2000m)
            - **Smart DND Memory**: Never turns off DND on exit if it was already on prior to entry
            - **Google Play Services Geofencing**: Hardware-accelerated background monitoring with low battery footprint
            - **OLED Dark Theme**: Emerald and Indigo neon accents
            
            #### Download:
            Download the attached `ZoneQuiet-${{ github.ref_name }}.apk` file below and install it directly on your Android device!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
