name: Publish GitHub Release with APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore restored from base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "debug.keystore generated via keytool"
          fi

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew || true

      - name: Build APK with Gradle
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug
          else
            ./gradlew assembleDebug
          fi

      - name: Prepare Release APK Asset
        run: |
          mkdir -p release-assets
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.1}"
          if [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.1"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/ZoneQuiet-${TAG_NAME}.apk"
          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV
          ls -lh release-assets/

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZoneQuiet-v1.0.1-apk
          path: release-assets/ZoneQuiet-*.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "ZoneQuiet ${{ env.RELEASE_TAG }}"
          tag_name: "${{ env.RELEASE_TAG }}"
          target_commitish: ${{ github.sha }}
          files: release-assets/ZoneQuiet-*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### ZoneQuiet Android Application v1.0.1
            
            **ZoneQuiet** automatically toggles Do Not Disturb (DND) when you enter a custom geofence perimeter and restores your normal alert mode when you leave.
            
            #### What's New in v1.0.1:
            - **Density-Aware Map Alignment**: Perfect 1:1 pixel rendering on high-DPI displays without tile shearing.
            - **CartoDB Dark Matter Tiles**: Fast, modern dark-mode vector tile CDN with fallback radar grid.
            - **Android Native Geocoder**: Reliable on-device address search with instant tap-to-search button.
            
            #### Download:
            Click on **ZoneQuiet-${{ env.RELEASE_TAG }}.apk** under Assets below to download and install!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
